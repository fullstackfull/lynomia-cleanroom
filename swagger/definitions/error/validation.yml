title: validation error
type: object
description: >
  Returned when a write is rejected by model validation. `message` is every error joined for display;
  `errors` and `error_types` are keyed by attribute so a form can put each message beside its own field and
  tell "already taken" from "wrong format".
properties:
  message:
    type: string
    description: Every validation error, joined
  attributes:
    type: array
    description: The attributes that were rejected
    items:
      type: string
  errors:
    type: object
    description: Messages, keyed by attribute
    additionalProperties:
      type: array
      items:
        type: string
  error_types:
    type: object
    description: The validator that rejected each attribute, keyed by attribute
    additionalProperties:
      type: array
      items:
        type: string
