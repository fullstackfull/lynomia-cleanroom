type: object
properties:
  name:
    type: string
    description: Rule name
    example: Add label on message create event
  description:
    type: string
    description: The description about the automation and actions
    example: Add label support and sales on message create event if incoming message content contains text help
  event_name:
    type: string
    enum:
      - conversation_created
      - conversation_updated
      - conversation_opened
      - conversation_resolved
      - message_created
      - commerce_order_created
      - commerce_order_updated
      - commerce_order_paid
      - commerce_order_shipped
      - commerce_order_delivered
      - commerce_order_cancelled
      - commerce_order_refunded
      - commerce_cart_abandoned
    example: message_created
    description: The trigger the rule runs on. The eight commerce events are real triggers whose availability depends on Commerce being enabled for the account; a rule naming one on an account without it is rejected with the reason.
  active:
    type: boolean
    description: Enable/disable automation rule
  actions:
    type: array
    description: Array of actions which you want to perform when condition matches, e.g add label support if message contains content help.
    items:
      type: object
      example:
        action_name: add_label
        action_params:
          - support
  conditions:
    type: array
    description: Array of conditions on which conversation filter would work, e.g message content contains text help.
    items:
      type: object
      example:
        attribute_key: content
        filter_operator: contains
        query_operator: OR
        values:
          - help
